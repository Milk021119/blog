# Decap CMS 配置
# 本地开发：用 `npx decap-server` 代理，无需 Git 后端鉴权
local_backend: true

backend:
  name: git-gateway        # 生产环境用 Git Gateway（Netlify Identity）或改 github
  branch: main

media_folder: "public/assets/images"   # 图片上传目录
public_folder: "/assets/images"        # 图片访问路径

collections:
  - name: "posts"
    label: "文章"
    folder: "src/content/posts"
    create: true                        # 允许新建文章
    slug: "{{slug}}"                    # 文件名用 slug
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "发布日期", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "分类", name: "category", widget: "string", default: "未分类" }
      - label: "标签"
        name: "tags"
        widget: "list"
        default: []
        field: { label: "标签", name: "tag", widget: "string" }
      - { label: "摘要", name: "excerpt", widget: "text", required: false }
      - { label: "草稿", name: "draft", widget: "boolean", default: false }
      - { label: "正文", name: "body", widget: "markdown" }
